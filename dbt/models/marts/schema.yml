version: 2

models:
  - name: fct_financials_pit
    description: >
      Bitemporal fact table: one row per (company, concept, fiscal period,
      filing that reported it). See the model SQL for the Phase 1b
      restatement-vs-tag-switch fix.
    columns:
      - name: entity_id
        tests: [not_null]
      - name: concept
        tests: [not_null]
      - name: period_end
        tests: [not_null]
      - name: value
        tests: [not_null]
      - name: source_tag
        tests: [not_null]
      - name: restatement_eligible
        tests: [not_null]
      - name: was_restated
        tests: [not_null]
      - name: tag_switch_detected
        tests: [not_null]

  - name: fct_beneish_mscore
    description: >
      Beneish M-Score, one row per (company, fiscal year). m_score is null
      (never zero-filled) when any of the 8 inputs is missing; see
      missing_inputs. See the model SQL and the README's M-Score section for
      methodology and validation against the case-study companies.
    columns:
      - name: entity_id
        tests: [not_null]
      - name: period_fiscal_year
        tests: [not_null]

  - name: fct_altman_zscore
    description: >
      Altman Z-Score, one row per (company, fiscal year). z_score is null
      when any of X1-X5 is missing; X4 (market value of equity) is
      structurally withheld for 20-F filers — see the README's Z-Score
      section.
    columns:
      - name: entity_id
        tests: [not_null]
      - name: period_fiscal_year
        tests: [not_null]

  - name: fct_piotroski_fscore
    description: >
      Piotroski F-Score, one row per (company, fiscal year). f_score is null
      when any of the 9 signals is missing; see missing_signals. See the
      README's F-Score section for methodology and the two shared-layer bugs
      found while building this model.
    columns:
      - name: entity_id
        tests: [not_null]
      - name: period_fiscal_year
        tests: [not_null]

  - name: fct_financials_asof
    description: >
      Point-in-time "as of" panel for Phase 4's case backtest -- pivoted
      financials per (backtest event, company, fiscal year), restricted to
      fiscal years whose 10-K/20-F was public by that event's as_of_date. See
      the model SQL and dbt/seeds/backtest_events.csv.
    columns:
      - name: entity_id
        tests: [not_null]
      - name: event_label
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]

  - name: fct_scores_asof
    description: >
      M-Score/Z-Score/F-Score recomputed on fct_financials_asof -- "what
      would this screen have shown as of each backtest event's as_of_date."
      Formulas are a deliberate, tested-against-drift duplication of the
      three production marts; see assert_asof_reconciles_with_production.sql.
    columns:
      - name: event_ticker
        tests: [not_null]
      - name: period_fiscal_year
        tests: [not_null]

  - name: fct_accrual_returns
    description: >
      Sloan (1996)-style accrual anomaly test: each company-fiscal-year's
      TATA accrual measure (reused from fct_beneish_mscore) paired with its
      12-month forward stock return, entered the first trading day on or
      after the 10-K became public (not period_end) to avoid lookahead. See
      src/redflag/sloan_test.py for the portfolio-sort statistical test.
    columns:
      - name: entity_id
        tests: [not_null]
      - name: period_fiscal_year
        tests: [not_null]

  - name: fct_dashboard
    description: >
      Denormalised, dashboard-ready export: one row per (company, fiscal
      year) with m_score/z_score/f_score, their standard-threshold flags,
      sector, and case-study annotation all in one table. Grain is a FULL
      OUTER JOIN across the three scoring marts, not an inner join -- a
      company-year missing one score (e.g. a 20-F filer with no z_score)
      still appears, with that column null. See src/redflag/export_dashboard.py
      and the README's Phase 5 section for the Power BI / Tableau build spec.
    columns:
      - name: entity_id
        tests: [not_null]
      - name: ticker
        tests: [not_null]
      - name: period_fiscal_year
        tests: [not_null]
      - name: red_flag_count
        tests: [not_null]
      - name: models_scored
        tests: [not_null]

seeds:
  - name: concepts
    description: Concept metadata exported from redflag.concepts (Python is the source of truth).
    columns:
      - name: concept
        tests: [not_null, unique]
      - name: sign_convention
        tests:
          - accepted_values:
              arguments:
                values: ["any", "always_positive"]
      - name: restatement_eligible
        tests: [not_null]

  - name: case_studies
    description: >
      Ticker -> why it's a case study, exported from redflag.universe's
      _CASE_STUDIES (Python is the source of truth). Joined onto
      fct_dashboard to annotate the known-outcome companies.
    columns:
      - name: ticker
        tests: [not_null, unique]
      - name: case_study_note
        tests: [not_null]

  - name: backtest_events
    description: >
      (ticker, as_of_date) pairs for Phase 4's point-in-time case backtest --
      one "pre_disclosure" row per case-study company (as_of_date shortly
      after their last pre-scandal 10-K/20-F was filed) plus a "full_history"
      control row (as_of_date 2099-01-01) used to reconcile fct_scores_asof
      against the production marts.
    columns:
      - name: ticker
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
